name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /var/www/dream-art-crm
            git pull origin main
            npm install --no-audit --no-fund
            # Ограничиваем heap Node, чтобы билд не словил OOM на 2GB-сервере.
            # set -e гарантирует: если билд упал — pm2 restart НЕ выполнится,
            # и сайт продолжит работать на прежней сборке (fail-safe).
            NODE_OPTIONS=--max-old-space-size=1536 npm run build
            pm2 restart dream-art --update-env
